name: Cognitio Agent SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      COGNITIO_DISABLE_MODELS_FETCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check generated contracts before any regeneration
        run: |
          bun run --cwd packages/agent-sdk check:openapi
          bun run --cwd packages/agent-sdk check:client
          bun run --cwd packages/agent-sdk check:models
      - name: Typecheck SDK and runtime
        run: |
          bun run --cwd packages/agent-sdk typecheck
          bun run --cwd packages/runtime typecheck
          bun run --cwd packages/sdk/js typecheck
      - name: Test SDK and low-level client
        run: |
          bun run --cwd packages/agent-sdk test:ci
          bun run --cwd packages/sdk/js test:ci
      - name: Build the host runtime and verify installed tarballs
        run: |
          bun run --cwd packages/agent-sdk build:binaries --single
          bun run --cwd packages/agent-sdk verify:release
      - name: Validate documentation and examples
        if: runner.os == 'Linux'
        run: |
          bun run --cwd packages/docs check
          bun run --cwd packages/docs validate
          bun run --cwd packages/agent-sdk test:examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-results-${{ matrix.os }}
          path: packages/agent-sdk/.artifacts/
          include-hidden-files: true
          if-no-files-found: ignore

  examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and check standalone cookbook projects
        run: |
          for manifest in examples/*/package.json; do
            directory="${manifest%/package.json}"
            npm ci --prefix "$directory" --no-audit --no-fund
            npm run --prefix "$directory" check
            rm -rf -- "$directory/node_modules"
          done

  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/runtime test:ci --shard ${{ matrix.shard }}/4
        env:
          COGNITIO_DISABLE_MODELS_FETCH: "1"
      - name: Verify the Node embedding boundary
        if: matrix.shard == 1
        run: bun run --cwd packages/runtime test:node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-results-${{ matrix.shard }}
          path: packages/runtime/.artifacts/unit/
          include-hidden-files: true
